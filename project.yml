name: DobleParsi
options:
  bundleIdPrefix: com.dobleparsi
  deploymentTarget:
    iOS: '16.0'
targets:
  DobleParsi:
    type: application
    platform: iOS
    sources: [DobleParsi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dobleparsi.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: دوبله پارسی
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
