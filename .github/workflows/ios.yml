name: iOS build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned iOS application
        run: xcodebuild -project DobleParsi.xcodeproj -scheme DobleParsi -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build SYMROOT="$RUNNER_TEMP/build"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/build/Release-iphoneos/DobleParsi.app" Payload/
          zip -qry DobleParsi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DobleParsi-unsigned
          path: DobleParsi-unsigned.ipa
